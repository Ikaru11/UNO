<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>[UNO]</title>
<style>
:root{--bg:#1c1a17;--pn:#2a2723;--ink:#f1e8d4;--mut:#a39a86;--r:#d6322b;--y:#f2b705;--g:#1f9d55;--b:#1f6fd1;--ln:#3d382f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Trebuchet MS",Verdana,sans-serif}
#app{height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
h1{font:400 76px/1 Impact,"Arial Black",sans-serif;letter-spacing:3px;margin:0 0 8px}
h1 span{color:var(--mut)}h1 .r{color:var(--r)}h1 .y{color:var(--y)}h1 .b{color:var(--b)}
h2{font:400 26px Impact,"Arial Black",sans-serif;margin:0 0 12px;letter-spacing:1px}
.c{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:center}
.mut{color:var(--mut);margin:0}
.bt{font:700 17px inherit;font-family:inherit;padding:15px;border:3px solid var(--ink);border-radius:10px;background:var(--ink);color:#1c1a17;cursor:pointer;box-shadow:0 4px 0 #0008;width:100%}
.bt:active{transform:translateY(3px);box-shadow:0 1px 0 #0008}
.bt.alt{background:transparent;color:var(--ink)}
.bt:disabled{opacity:.35;cursor:default;box-shadow:none}
label{display:block;text-align:left;color:var(--mut);font-size:14px}
input,select{width:100%;margin-top:4px;padding:13px;font:inherit;font-size:17px;color:var(--ink);background:var(--pn);border:2px solid var(--ln);border-radius:8px}
input:focus,select:focus{outline:none;border-color:var(--y)}
input.big{font:400 44px Impact,sans-serif;letter-spacing:.4em;text-indent:.4em;text-align:center}
.err{background:#4a1f1b;border:2px solid var(--r);border-radius:8px;padding:10px;text-align:left}
.lv{color:var(--mut);text-align:center;padding:8px;font-size:14px;text-decoration:underline}
.code{font:400 72px Impact,sans-serif;letter-spacing:.25em;text-indent:.25em;color:var(--y)}
.pl{list-style:none;margin:0;padding:0;text-align:left}
.pl li{padding:10px 12px;border-bottom:1px solid var(--ln)}
.pl em{font-size:12px;color:var(--bg);background:var(--mut);border-radius:4px;padding:1px 6px;font-style:normal;margin-left:6px}
.wait{color:var(--mut);margin:6px}
.bar{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:14px;color:var(--mut)}
.bar b{color:var(--ink);letter-spacing:2px}
.bar .ln{background:none;border:1px solid var(--ln);color:var(--mut);border-radius:6px;padding:4px 8px;font:inherit;font-size:12px}
.opps{display:flex;gap:6px;flex-wrap:wrap}
.opp{flex:1;min-width:96px;background:var(--pn);border:2px solid var(--ln);border-radius:8px;padding:6px 9px;font-size:13px;display:flex;flex-direction:column}
.opp span{color:var(--mut);font-size:12px}
.opp.tn{border-color:var(--y);animation:pl 1s infinite alternate}
.opp.off{opacity:.45}
@keyframes pl{to{box-shadow:0 0 0 3px #f2b70055}}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;min-height:0}
.tbl{display:flex;align-items:center;gap:22px}
.pile{text-align:center;cursor:pointer}
.pile small{display:block;color:var(--mut)}
.ring{padding:6px;border-radius:16px;box-shadow:0 0 0 5px var(--c)}
.dir{font-size:34px;color:var(--mut)}
.log{margin:0;text-align:center;font-size:14px;color:var(--mut);min-height:40px}
.card{width:64px;height:96px;border-radius:9px;border:3px solid #f6efe0;position:relative;flex:none;display:grid;place-items:center;font-family:Impact,"Arial Black",sans-serif;color:#fff;box-shadow:0 2px 0 #0007}
.card.r{background:var(--r)}.card.y{background:var(--y)}.card.g{background:var(--g)}.card.b{background:var(--b)}.card.k,.card.bk{background:#16140f}
.cn{display:grid;place-items:center;width:78%;height:60%;background:#f6efe0;border-radius:50%;transform:rotate(-24deg);font-size:30px;font-weight:400}
.r .cn{color:var(--r)}.y .cn{color:#b58500}.g .cn{color:var(--g)}.b .cn{color:var(--b)}
.k .cn{background:conic-gradient(var(--r) 0 25%,var(--b) 0 50%,var(--g) 0 75%,var(--y) 0);color:#fff;text-shadow:0 1px 3px #000}
.bk .cn{background:var(--r);color:#f6efe0;font-size:17px}
.ct,.cb{position:absolute;font-size:12px}.ct{top:3px;left:5px}.cb{bottom:3px;right:5px;transform:rotate(180deg)}
.pop{animation:drop .35s ease-out}
@keyframes drop{from{transform:translateY(-70px) rotate(-30deg) scale(1.35);opacity:0}}
.hand{display:flex;justify-content:safe center;overflow-x:auto;padding:24px 10px 8px;min-height:134px}
.hand .card{margin-left:-20px;transition:transform .15s}
.hand .card:first-child{margin-left:0}
.hand .card.ok{transform:translateY(-16px)}
.hand .card.no{filter:brightness(.55)}
.act{display:flex;gap:12px;align-items:center;padding:6px 0}
.act span{flex:1;font-size:14px}
.act .bt{width:150px;padding:13px}
.res{background:var(--pn);border:2px solid var(--ln);border-radius:12px;padding:18px;width:100%;text-align:center}
.res ol{text-align:left;padding-left:24px;margin:0 0 10px}
.res li span{display:inline-block;width:70%}
.mod{position:fixed;inset:0;background:#000b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:5}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:260px}
.cols button{height:80px;border:3px solid #f6efe0;border-radius:12px;font:700 16px inherit;font-family:inherit;color:#fff;cursor:pointer}
.banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font:400 54px Impact,sans-serif;background:var(--y);color:#1c1a17;padding:6px 22px;border-radius:12px;border:4px solid #1c1a17;z-index:9;animation:bn 1.5s forwards;white-space:nowrap}
@keyframes bn{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}20%{transform:translate(-50%,-50%) scale(1.1) rotate(3deg);opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
.toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:var(--ink);color:#1c1a17;padding:9px 16px;border-radius:8px;z-index:9;font-size:14px;animation:ts 2.4s forwards}
@keyframes ts{0%,85%{opacity:1}100%{opacity:0}}
</style></head>
<body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const PFX='UNOX',CH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',$=s=>document.querySelector(s);
const COL={r:'Merah',y:'Kuning',g:'Hijau',b:'Biru'},SYM={S:'⊘',R:'⇄',D:'+2',W:'',F:'+4'};
let peer,conn,isHost=false,G=null,S=null,scr='menu',busy=false,err='',pend=null,snd=true,AC,lastTop=-1;
let F={name:'',code:'',max:4,target:200};
try{F.name=localStorage.getItem('uno-nama')||''}catch(e){}
const rnd=n=>crypto.getRandomValues(new Uint32Array(1))[0]%n;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- suara ---------- */
function tone(f,d,t='square',v=.07,at=0){if(!snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+at;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d)}catch(e){}}
const seq=(a,d,t,v,g)=>a.forEach((f,i)=>tone(f,d,t,v,i*g));
const SFX={play:()=>seq([520,780],.09,'square',.06,.06),draw:()=>tone(220,.13,'triangle',.12),turn:()=>seq([660,880],.15,'sine',.13,.1),uno:()=>seq([523,659,784,1047],.14,'square',.07,.08),win:()=>seq([523,659,784,659,784,1047],.2,'triangle',.13,.12),lose:()=>seq([392,330,262],.28,'sawtooth',.05,.18),err:()=>tone(150,.2,'sawtooth',.06)};
function toast(t){SFX.err();const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
function banner(t){const d=document.createElement('div');d.className='banner';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1500)}

/* ---------- logika game (hanya di host) ---------- */
const lab=v=>({S:'Lewati',R:'Balik',D:'+2'}[v]||v);
const nm=c=>c.c==='k'?(c.v==='F'?'Wild +4':'Wild'):COL[c.c]+' '+lab(c.v);
const pts=c=>c.c==='k'?50:'SRD'.includes(c.v)?20:+c.v;
function mkDeck(){const d=[];let id=0;for(const c of 'rygb'){d.push({id:id++,c,v:'0'});for(let k=0;k<2;k++){for(let v=1;v<=9;v++)d.push({id:id++,c,v:''+v});for(const v of 'SRD')d.push({id:id++,c,v})}}for(let k=0;k<4;k++){d.push({id:id++,c:'k',v:'W'});d.push({id:id++,c:'k',v:'F'})}return d}
function shuf(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function newG(max,target){G={ph:'lobby',code:'',set:{max,target},ps:[],deck:[],disc:[],turn:0,dir:1,color:'r',drew:null,round:0,log:'',res:null}}
const fits=c=>c.c==='k'||c.c===G.color||c.v===G.disc[G.disc.length-1].v;
function drawN(p,n){const got=[];for(let i=0;i<n;i++){if(!G.deck.length&&G.disc.length>1){const t=G.disc.pop();G.deck=shuf(G.disc);G.disc=[t]}if(!G.deck.length)break;const c=G.deck.pop();p.hand.push(c);got.push(c)}return got}
function nxt(k=1){const n=G.ps.length;G.turn=((G.turn+G.dir*k)%n+n)%n}
function startRound(){
 G.ps=G.ps.filter((p,i)=>i===0||p.ok);
 if(G.ps.length<2)return endAll('Pemain lain keluar. Game berakhir.');
 G.deck=shuf(mkDeck());G.disc=[];G.ps.forEach(p=>{p.hand=[];drawN(p,7)});
 let c;do{c=G.deck.pop();if(c.c==='k'||'SRD'.includes(c.v)){G.deck.unshift(c);c=null}}while(!c);
 G.disc=[c];G.color=c.c;G.dir=1;G.drew=null;G.turn=G.round%G.ps.length;G.round++;G.ph='play';G.res=null;G.log='Ronde '+G.round+' dimulai.';tick()}
function endAll(msg){G.ph='over';G.res={wi:null,msg};tick()}
function endRound(i){const w=G.ps[i];let s=0;G.ps.forEach(q=>q.hand.forEach(c=>s+=pts(c)));w.score+=s;
 const done=w.score>=G.set.target;G.res={wi:i,w:w.name,s};G.log=w.name+' kehabisan kartu!';G.ph=done?'over':'round';tick()}
function bad(i,m){if(i===0)toast(m);else{const c=G.ps[i]&&G.ps[i].conn;if(c&&c.open)c.send({t:'e',m})}}
function handle(i,m){const p=G.ps[i];if(!p||!m)return;
 if(m.t==='start'){if(i||G.ph!=='lobby')return bad(i,'Aksi tidak sah.');if(G.ps.length<2)return bad(i,'Butuh minimal 2 pemain.');G.round=0;G.ps.forEach(q=>q.score=0);return startRound()}
 if(m.t==='next'){if(i||G.ph!=='round')return bad(i,'Aksi tidak sah.');return startRound()}
 if(m.t==='again'){if(i||G.ph!=='over')return bad(i,'Aksi tidak sah.');G.ps=G.ps.filter((q,j)=>!j||q.ok);G.ph='lobby';return tick()}
 if(G.ph!=='play'||G.turn!==i)return bad(i,'Belum giliranmu.');
 if(m.t==='draw'){if(G.drew!==null)return bad(i,'Kamu sudah mengambil kartu.');
  const[c]=drawN(p,1);if(!c){G.log='Tumpukan habis, '+p.name+' pas.';nxt();return tick()}
  G.drew=c.id;G.log=p.name+' mengambil kartu.';
  if(!fits(c)){G.drew=null;G.log+=' Tidak cocok, giliran lewat.';nxt()}return tick()}
 if(m.t==='pass'){if(G.drew===null)return bad(i,'Ambil kartu dulu.');G.drew=null;G.log=p.name+' pas.';nxt();return tick()}
 if(m.t==='play'){const k=p.hand.findIndex(c=>c.id===m.id);if(k<0)return bad(i,'Kartu tidak ditemukan.');const c=p.hand[k];
  if(G.drew!==null&&c.id!==G.drew)return bad(i,'Hanya kartu yang baru diambil yang boleh dimainkan.');
  if(!fits(c))return bad(i,'Kartu itu tidak cocok.');
  if(c.c==='k'&&!(typeof m.color==='string'&&m.color.length===1&&'rygb'.includes(m.color)))return bad(i,'Pilih warna dulu.');
  p.hand.splice(k,1);G.disc.push(c);G.color=c.c==='k'?m.color:c.c;G.drew=null;
  G.log=p.name+' memainkan '+nm(c)+(c.c==='k'?' → '+COL[G.color]:'');
  if(!p.hand.length)return endRound(i);
  const n=G.ps.length;
  if(c.v==='R'){G.dir*=-1;nxt(n===2?2:1)}
  else if(c.v==='S')nxt(2);
  else if(c.v==='D'||c.v==='F'){nxt();const t=G.ps[G.turn],q=c.v==='D'?2:4;drawN(t,q);G.log+=' — '+t.name+' ambil '+q+' dan dilewati';nxt()}
  else nxt();
  tick()}}
function view(i){const p=G.ps[i];return{ph:G.ph,code:G.code,set:G.set,me:i,turn:G.turn,dir:G.dir,top:G.disc[G.disc.length-1]||null,color:G.color,deckN:G.deck.length,drew:G.drew,hand:G.ph==='play'?p.hand:[],ps:G.ps.map(q=>({name:q.name,n:q.hand.length,score:q.score,ok:q.ok})),log:G.log,res:G.res,round:G.round}}
function tick(){G.ps.forEach((p,i)=>{const v=view(i);if(i===0)onState(v);else if(p.conn&&p.conn.open)p.conn.send({t:'s',s:v})});
 if(G.ph==='play'&&!G.ps[G.turn].ok){const t=G.turn,r=G.round;setTimeout(()=>{if(G&&G.ph==='play'&&G.turn===t&&G.round===r)auto()},900)}}
function auto(){const t=G.turn;handle(t,{t:'draw'});if(G.ph==='play'&&G.turn===t&&G.drew!==null)handle(t,{t:'pass'})}
function gone(c){if(!G)return;const i=G.ps.findIndex(p=>p.conn===c);if(i<1)return;
 if(G.ph==='play'){G.ps[i].ok=false;G.log=G.ps[i].name+' terputus.';
  if(G.ps.filter(p=>p.ok).length<2)endAll('Pemain aktif kurang dari 2. Game berakhir.');else tick()}
 else{G.ps.splice(i,1);tick()}}
function hostConn(c){
 c.on('data',m=>{if(!G||!m)return;const i=G.ps.findIndex(p=>p.conn===c);
  if(m.t==='join'){if(i>=0)return;
   const no=t=>{c.send({t:'e',m:t,fatal:1});setTimeout(()=>c.close(),400)};
   if(G.ph!=='lobby')return no('Game sudah dimulai, kamu belum bisa bergabung. Minta host membuat room baru.');
   if(G.ps.length>=G.set.max)return no('Room sudah penuh.');
   G.ps.push({name:String(m.name||'').trim().slice(0,14)||'Pemain',conn:c,hand:[],score:0,ok:true});return tick()}
  if(i>=0)handle(i,m)});
 c.on('close',()=>gone(c));c.on('error',()=>gone(c))}

/* ---------- jaringan ---------- */
function friendly(e){return['network','server-error','socket-error','socket-closed'].includes(e.type)?'Tidak bisa terhubung ke server sinyal. Cek internet kamu lalu coba lagi.':'Terjadi masalah koneksi. Coba lagi ya.'}
function fail(m,pr){try{pr&&pr.destroy()}catch(e){}busy=false;err=m;render()}
function netErr(e,pr){if(busy)fail(friendly(e),pr);else toast(friendly(e))}
function leave(m){try{peer&&peer.destroy()}catch(e){}peer=conn=null;G=S=null;isHost=false;busy=false;pend=null;err=m||'';scr='menu';render()}
function mkRoom(name,tries=0){
 if(tries>=5)return fail('Gagal membuat room setelah beberapa kali mencoba. Coba lagi sebentar lagi.');
 let code='';for(let i=0;i<4;i++)code+=CH[rnd(CH.length)];
 const pr=new Peer(PFX+'-'+code);
 pr.on('open',()=>{peer=pr;isHost=true;newG(F.max,F.target);G.code=code;G.ps=[{name,conn:null,hand:[],score:0,ok:true}];pr.on('connection',hostConn);tick()});
 pr.on('error',e=>{if(e.type==='unavailable-id'){pr.destroy();mkRoom(name,tries+1)}else netErr(e,pr)});
 pr.on('disconnected',()=>{try{pr.reconnect()}catch(x){}})}
function joinRoom(code,name){
 let done=false;const pr=new Peer();
 const to=setTimeout(()=>{if(!done)fail('Waktu habis saat menyambung. Cek internet dan kode room.',pr)},12000);
 pr.on('open',()=>{const c=pr.connect(PFX+'-'+code,{reliable:true});
  c.on('open',()=>{done=true;clearTimeout(to);peer=pr;conn=c;c.send({t:'join',name})});
  c.on('data',m=>{if(!m)return;if(m.t==='s')onState(m.s);else if(m.t==='e'){if(m.fatal){conn=null;leave(m.m)}else toast(m.m)}});
  c.on('close',()=>{if(conn===c)leave('Koneksi ke host terputus.')})});
 pr.on('error',e=>{clearTimeout(to);if(e.type==='peer-unavailable')fail('Room tidak ditemukan. Cek lagi kodenya.',pr);else netErr(e,pr)})}
function act(m){if(isHost)handle(0,m);else if(conn&&conn.open)conn.send(m);else leave('Koneksi ke host terputus.')}

/* ---------- aksi UI ---------- */
function go(s){scr=s;err='';render()}
function chk(){F.name=F.name.trim();if(!F.name){err='Isi nama panggilan dulu.';render();return false}
 if(typeof Peer==='undefined'){err='Pustaka koneksi gagal dimuat. Cek internet lalu muat ulang halaman.';render();return false}
 try{localStorage.setItem('uno-nama',F.name)}catch(e){}err='';busy=true;render();return true}
function mk(){if(chk())mkRoom(F.name)}
function jn(){if(F.code.length!==4){err='Kode room terdiri dari 4 karakter.';return render()}if(chk())joinRoom(F.code,F.name)}
const playable=c=>(S.drew===null||c.id===S.drew)&&(c.c==='k'||c.c===S.color||c.v===S.top.v);
function pick(id){const c=S.hand.find(x=>x.id===id);if(!c||S.ph!=='play')return;if(S.turn!==S.me)return toast('Belum giliranmu.');if(!playable(c))return toast('Kartu itu tidak cocok.');if(c.c==='k'){pend=id;return render()}act({t:'play',id})}
function colr(k){const id=pend;pend=null;act({t:'play',id,color:k})}
function draw(){if(S&&S.ph==='play'&&S.turn===S.me&&S.drew===null)act({t:'draw'});else if(S&&S.ph==='play')toast(S.turn!==S.me?'Belum giliranmu.':'Kamu sudah mengambil kartu.')}

/* ---------- efek & render ---------- */
const tot=s=>s.ps.reduce((a,p)=>a+p.n,0);
function fx(o,s){if(!o)return;
 if(s.ph==='play'){
  if(o.ph==='play'&&s.top&&o.top&&o.top.id!==s.top.id)SFX.play();else if(o.ph==='play'&&tot(s)>tot(o))SFX.draw();
  s.ps.forEach((p,i)=>{if(o.ph==='play'&&o.ps[i]&&p.n===1&&o.ps[i].n>1){SFX.uno();banner(p.name+': UNO!')}});
  if(s.turn===s.me&&(o.ph!=='play'||o.turn!==s.me)){SFX.turn();navigator.vibrate&&navigator.vibrate(60)}
 }else if(o.ph==='play'){s.res&&s.res.wi===s.me?SFX.win():SFX.lose()}}
function onState(s){const o=S;S=s;busy=false;if(s.ph!=='play')pend=null;fx(o,s);render()}
function card(c,cls='',at=''){const v=SYM[c.v]!==undefined?SYM[c.v]:c.v;return `<div class="card ${c.c} ${cls}" ${at}><b class=cn>${v}</b><span class=ct>${v}</span><span class=cb>${v}</span></div>`}
const leaveLink='<a class=lv href="#" onclick="leave();return false">Keluar dari room</a>';
const errBox=()=>err?`<div class=err>${esc(err)}</div>`:'';
function menuHTML(){return `<div class=c><div><h1><span>[</span><i class=r style="font-style:normal">U</i><i class=y style="font-style:normal">N</i><i class=b style="font-style:normal">O</i><span>]</span></h1><p class=mut>Habiskan kartumu lebih dulu. Main bareng teman lewat HP masing-masing.</p></div>${errBox()}<button class=bt onclick="go('create')">Buat room (jadi host)</button><button class="bt alt" onclick="go('join')">Gabung room</button></div>`}
const nameIn=()=>`<label>Nama panggilan<input maxlength=14 value="${esc(F.name)}" oninput="F.name=this.value" autocomplete=off></label>`;
function createHTML(){const sel=(arr,k)=>arr.map(n=>`<option ${F[k]==n?'selected':''}>${n}</option>`).join('');
 return `<div class=c><h2>Buat room</h2>${errBox()}${nameIn()}<label>Jumlah pemain maksimum<select onchange="F.max=+this.value">${sel([2,3,4,5,6],'max')}</select></label><label>Target skor (poin)<select onchange="F.target=+this.value">${sel([100,200,300,500],'target')}</select></label><button class=bt ${busy?'disabled':''} onclick="mk()">${busy?'Membuat room...':'Buat room'}</button><a class=lv href="#" onclick="go('menu');return false">Kembali</a></div>`}
function joinHTML(){return `<div class=c><h2>Gabung room</h2>${errBox()}<label>Kode room<input class=big maxlength=4 value="${esc(F.code)}" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'');F.code=this.value" autocomplete=off autocapitalize=characters></label>${nameIn()}<button class=bt ${busy?'disabled':''} onclick="jn()">${busy?'Menyambung...':'Gabung'}</button><a class=lv href="#" onclick="go('menu');return false">Kembali</a></div>`}
function resHTML(){const s=S,r=s.res||{};const rk=s.ps.map((p,i)=>({...p,i})).sort((a,b)=>b.score-a.score);
 const t=r.wi==null?esc(r.msg||'Game selesai.'):esc(r.w)+(s.ph==='over'?' menang game!':' menang ronde ini (+'+r.s+' poin)');
 return `<div class=res><h2>${t}</h2><ol>${rk.map(p=>`<li><span>${esc(p.name)}${p.i===s.me?' (kamu)':''}${p.ok?'':' (putus)'}</span><b>${p.score}</b></li>`).join('')}</ol><p class=mut>Target ${s.set.target} poin</p>${s.me===0?`<button class=bt onclick="act({t:'${s.ph==='over'?'again':'next'}'})">${s.ph==='over'?'Main lagi':'Ronde berikutnya'}</button>`:'<p class=wait>Menunggu host...</p>'}</div>`}
function gameHTML(){const s=S;
 let h=`<div class=bar><span>Room <b>${s.code}</b>${s.ph==='lobby'?'':' · Ronde '+s.round}</span><button class=ln onclick="snd=!snd;render()">Suara: ${snd?'nyala':'mati'}</button></div>`;
 if(s.ph==='lobby'){
  return h+`<div class=c><p class=mut>Kode room — bagikan ke teman</p><div class=code>${s.code}</div><p>Pemain ${s.ps.length}/${s.set.max} · target ${s.set.target} poin</p><ul class=pl>${s.ps.map((p,i)=>`<li>${esc(p.name)}${i===0?'<em>host</em>':''}${i===s.me?'<em>kamu</em>':''}</li>`).join('')}</ul>${s.me===0?`<button class=bt ${s.ps.length<2?'disabled':''} onclick="act({t:'start'})">Mulai main</button>`:'<p class=wait>Menunggu host memulai...</p>'}</div>`+leaveLink}
 const play=s.ph==='play',my=play&&s.turn===s.me;
 h+=`<div class=opps>${s.ps.map((p,i)=>i===s.me?'':`<div class="opp${play&&s.turn===i?' tn':''}${p.ok?'':' off'}"><b>${esc(p.name)}</b><span>${p.n} kartu · ${p.score} poin${p.ok?'':' · putus'}</span></div>`).join('')}</div>`;
 if(play){
  const np=s.top.id!==lastTop;lastTop=s.top.id;
  h+=`<div class=mid><div class=tbl><div class=pile onclick="draw()"><div class="card bk"><b class=cn>UNO</b></div><small>${s.deckN}</small></div><div class=ring style="--c:var(--${s.color})">${card(s.top,np?'pop':'')}</div><div class=dir>${s.dir>0?'↻':'↺'}</div></div><p class=log>${esc(s.log)}<br>Warna: ${COL[s.color]}</p></div>`;
  h+=`<div class=hand>${s.hand.map(c=>card(c,my&&playable(c)?'ok':'no',`onclick="pick(${c.id})"`)).join('')}</div>`;
  const me=s.ps[s.me];
  const st=my?(s.drew!==null?'Kartu barumu bisa dimainkan, atau pas.':'Giliranmu! Mainkan kartu atau ambil.'):'Giliran '+esc(s.ps[s.turn].name)+'...';
  h+=`<div class=act><span>${me.n===1?'<b>UNO!</b> ':''}${st}</span><button class=bt ${my?'':'disabled'} onclick="${s.drew!==null?"act({t:'pass'})":'draw()'}">${s.drew!==null?'Pas':'Ambil kartu'}</button></div>`;
 }else h+=`<div class=mid>${resHTML()}</div>`;
 if(pend!==null)h+=`<div class=mod><h2>Pilih warna</h2><div class=cols>${['r','y','g','b'].map(k=>`<button style="background:var(--${k})" onclick="colr('${k}')">${COL[k]}</button>`).join('')}</div><a class=lv href="#" onclick="pend=null;render();return false">Batal</a></div>`;
 return h+leaveLink}
function render(){const a=$('#app'),o=a.querySelector('.hand'),sl=o?o.scrollLeft:0;
 a.innerHTML=S?gameHTML():scr==='create'?createHTML():scr==='join'?joinHTML():menuHTML();
 const n=a.querySelector('.hand');if(n)n.scrollLeft=sl}
render();
</script></body></html>
